name: Publish GitHub Pages

# Intentionally NOT on every main push — keep local/dev independent of the live site.
#
# Publish when stabilized (any one):
#   1. Actions → Publish GitHub Pages → Run workflow
#   2. git push origin HEAD:publish/pages
#   3. ./scripts/publish-pages.sh   (local build + push gh-pages)
#
# One-time: Settings → Pages → Deploy from a branch → gh-pages / (root)

on:
  workflow_dispatch:
  push:
    branches: [publish/pages]

permissions:
  contents: write
  pages: write
  administration: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build static site (.env.pages)
        run: bash scripts/build-pages.sh

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Publish Mirage Pages from ${{ github.sha }}"

      - name: Ensure Pages is enabled (gh-pages / root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          gh api -X PATCH "repos/$REPO" -f private=false -f visibility=public || true
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo "$BODY" | gh api -X POST "repos/$REPO/pages" --input - \
            || echo "$BODY" | gh api -X PUT "repos/$REPO/pages" --input -
          gh api "repos/$REPO/pages"
