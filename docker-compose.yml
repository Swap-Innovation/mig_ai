services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: migrate
      POSTGRES_PASSWORD: migrate
      POSTGRES_DB: migrate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://migrate:migrate@postgres:5432/migrate
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: demo-secret-change-me
      SAMPLE_PROJECTS_ROOT: /app/sample-data/projects
      SAMPLE_PROJECT_ID: party-customer-wave1
      SAMPLE_LEGACY_PATH: /app/sample-data/projects/party-customer-wave1/legacy
      MIGRATION_REPO_PATH: /app/sample-data/projects/party-customer-wave1/migration-repo
      GCS_ENDPOINT: http://minio:9000
      GCS_ACCESS_KEY: minioadmin
      GCS_SECRET_KEY: minioadmin
      LLM_MODE: mock
    ports:
      - "8000:8000"
    volumes:
      - ./sample-data:/app/sample-data
      - ./backend/adapters:/app/adapters
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://migrate:migrate@postgres:5432/migrate
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: demo-secret-change-me
      SAMPLE_PROJECTS_ROOT: /app/sample-data/projects
      SAMPLE_PROJECT_ID: party-customer-wave1
      SAMPLE_LEGACY_PATH: /app/sample-data/projects/party-customer-wave1/legacy
      MIGRATION_REPO_PATH: /app/sample-data/projects/party-customer-wave1/migration-repo
      GCS_ENDPOINT: http://minio:9000
      GCS_ACCESS_KEY: minioadmin
      GCS_SECRET_KEY: minioadmin
      LLM_MODE: mock
    volumes:
      - ./sample-data:/app/sample-data
      - ./backend/adapters:/app/adapters
    depends_on:
      - postgres
      - redis
      - api

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
